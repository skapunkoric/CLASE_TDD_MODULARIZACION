name: Suite de Tests Automáticos

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testear:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código
      uses: actions/checkout@v4
    
    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install pytest tabulate
        
    - name: Configurar PYTHONPATH y correr tests
      env:
        PYTHONPATH: .
      run: |
        pytest